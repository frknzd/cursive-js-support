# Release version bumps — `bump-my-version bump patch|minor|major`.
#
# `pluginVersion` in gradle.properties stays the single source of truth; this keeps CHANGELOG.md,
# the release commit, and the `v*` tag that .github/workflows/release.yml listens for in step with
# it. Nothing is pushed: run `git push --follow-tags` when you actually want the release to go out.
[tool.bumpversion]
current_version = "1.3.1"
# Pre-release versions are accepted so a bump from 1.4.0-beta.1 parses, but they are never produced
# automatically — cut one explicitly with `--new-version 1.4.0-beta.1`, which the publishing
# channel logic in build.gradle.kts routes to the `beta` channel.
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<pre_l>[a-z]+)\.(?P<pre_n>\d+))?'
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
message = "Release {new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "gradle.properties"
search = "pluginVersion={current_version}"
replace = "pluginVersion={new_version}"

# Opens a section for the release directly under [Unreleased], so whatever you accumulated there
# while working becomes this release's Marketplace "What's New".
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}]"""
